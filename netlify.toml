[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/store"
  to = "/.netlify/functions/store"
  status = 200

[[edge_functions]]
  function = "storefront"
  path = "/"

