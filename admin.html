<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PINC × MINT Admin</title><style>:root{--p:#ff4fa3;--v:#8b5cf6;--bg:#160d1f;--card:#26152f;--line:#4b3453;--muted:#cdbdd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui;padding:18px}.wrap{max-width:1200px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{border:0;border-radius:9px;padding:9px 12px;background:#352044;color:#fff;font-weight:800}.primary{background:linear-gradient(135deg,var(--p),var(--v))}.field{margin:8px 0}.field input,.field select{width:100%;background:#160d1f;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.muted{color:var(--muted)}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div id="login" class="card"><h1>THE PINC PH × MINT Admin</h1><div class="field"><label>Admin token</label><input id="token" type="password"></div><button class="primary" onclick="login()">Enter dashboard</button><p id="err" class="muted"></p></div><div id="app" class="hidden"><div class="card"><h2>Store dashboard</h2><p class="muted">Products • Inventory • Orders • Promos • Reviews • Reports</p><div class="tabs"><button class="primary" onclick="show('overview')">Overview</button><button onclick="show('products')">Products</button><button onclick="show('orders')">Orders</button><button onclick="show('promos')">Promos</button><button onclick="show('reviews')">Reviews</button><button onclick="show('reports')">Reports</button><button onclick="logout()">Log out</button></div></div><section id="overview"></section><section id="products" class="hidden"></section><section id="orders" class="hidden"></section><section id="promos" class="hidden"></section><section id="reviews" class="hidden"></section><section id="reports" class="hidden"></section></div></main><script>let token=localStorage.getItem('pxm_admin_token')||'',data={};const $=id=>document.getElementById(id),money=n=>'₱'+Number(n||0).toLocaleString('en-PH');async function api(action,opts={}){let method=opts.method||'GET',url='/api/store'+(method==='GET'?'?action='+encodeURIComponent(action):'');let r=await fetch(url,{method,headers:{'content-type':'application/json','x-admin-token':token},body:method==='GET'?undefined:JSON.stringify({action,...(opts.body||{})})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function login(){token=$('token').value;try{await api('products');localStorage.setItem('pxm_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();show('overview')}catch(e){$('err').textContent=e.message}}function logout(){localStorage.removeItem('pxm_admin_token');location.reload()}async function load(){data.products=await api('products');data.orders=await api('orders');data.promos=await api('promos');data.reviews=await api('reviews');data.report=await api('report')}function show(id){['overview','products','orders','promos','reviews','reports'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='overview')$('overview').innerHTML='<div class="cards"><div class="card"><div class="muted">Orders</div><h2>'+data.report.summary.orders+'</h2></div><div class="card"><div class="muted">Sales</div><h2>'+money(data.report.summary.sales)+'</h2></div><div class="card"><div class="muted">Low stock ≤2</div><h2>'+data.products.filter(p=>p.stock!==null&&p.stock<=2&&p.active).length+'</h2></div></div>';if(id==='products')$('products').innerHTML='<div class="card"><h2>Products & inventory</h2><div class="table"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>'+data.products.map(p=>'<tr><td>'+p.name+'</td><td>'+p.category+'</td><td>'+money(p.price)+'</td><td><input id="s-'+p.id+'" value="'+(p.stock??'')+'" style="width:65px"></td><td><input type="checkbox" id="a-'+p.id+'" '+(p.active?'checked':'')+'></td><td><button onclick="saveProduct(\''+p.id+'\')">Save</button></td></tr>').join('')+'</table></div></div>';if(id==='orders')$('orders').innerHTML='<div class="card"><h2>Orders</h2><div class="table"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr>'+data.orders.map(o=>'<tr><td>'+o.order_no+'</td><td>'+o.customer_name+'<br>'+o.mobile+'</td><td>'+money(o.total)+'</td><td><select id="st-'+o.order_no+'"><option>'+o.status+'</option><option>Unpaid / Unconfirmed</option><option>Payment Confirmed</option><option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></td><td><button onclick="pay(\''+o.order_no+'\')">Confirm payment</button> <button onclick="status(\''+o.order_no+'\')">Save</button></td></tr>').join('')+'</table></div></div>';if(id==='promos')$('promos').innerHTML='<div class="card"><h2>Promo codes</h2><div class="cards"><div class="field"><label>Code</label><input id="pc"></div><div class="field"><label>Type</label><select id="pt"><option value="percent">Percent</option><option value="fixed">Fixed ₱</option></select></div><div class="field"><label>Amount</label><input id="pa" type="number"></div></div><button class="primary" onclick="promo()">Save promo</button><div class="table"><table><tr><th>Code</th><th>Discount</th><th>Active</th></tr>'+data.promos.map(p=>'<tr><td>'+p.code+'</td><td>'+p.amount+(p.discount_type==='percent'?'%':' ₱')+'</td><td>'+p.active+'</td></tr>').join('')+'</table></div></div>';if(id==='reviews')$('reviews').innerHTML='<div class="card"><h2>Reviews</h2><div class="table"><table><tr><th>Order</th><th>Product</th><th>Rating</th><th>Review</th><th></th></tr>'+data.reviews.map(r=>'<tr><td>'+r.order_no+'</td><td>'+r.product_name+'</td><td>'+r.rating+'/5</td><td>'+r.review_text+'</td><td><button onclick="approve('+r.id+','+(!r.approved)+')">'+(r.approved?'Hide':'Approve')+'</button></td></tr>').join('')+'</table></div></div>';if(id==='reports')$('reports').innerHTML='<div class="card"><h2>Sales report</h2><p>Last 30 days: '+data.report.summary.orders+' orders, '+money(data.report.summary.sales)+' sales.</p><div class="table"><table><tr><th>Date</th><th>Orders</th><th>Sales</th></tr>'+data.report.byDate.map(x=>'<tr><td>'+x.day+'</td><td>'+x.orders+'</td><td>'+money(x.sales)+'</td></tr>').join('')+'</table></div></div>'}async function saveProduct(id){let p=data.products.find(x=>x.id===id);await api('update_product',{method:'POST',body:{product:{...p,stock:$('s-'+id).value,active:$('a-'+id).checked}}});await load();show('products')}async function pay(no){await api('update_order',{method:'POST',body:{order_no:no,payment_confirmed:true}});await load();show('orders')}async function status(no){await api('update_order',{method:'POST',body:{order_no:no,status:$('st-'+no).value}});await load();show('orders')}async function promo(){await api('create_promo',{method:'POST',body:{promo:{code:$('pc').value,discount_type:$('pt').value,amount:$('pa').value}}});await load();show('promos')}async function approve(id,approved){await api('approve_review',{method:'POST',body:{id,approved}});await load();show('reviews')}if(token)login();</script></body></html>
